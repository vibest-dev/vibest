name: Set the release version
description: Sets the version in every package.json of VERSIONED with bumpp (this checkout only; no commit, tag or push) and records the tree
inputs:
  version:
    description: The release version
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        # shellcheck disable=SC2086 # VERSIONED is a list of globs
        pnpm exec bumpp --release "$VERSION" $VERSIONED --no-commit --no-tag --no-push --yes --quiet
        for f in $VERSIONED; do
          v=$(node -p "require('./$f').version")
          if [ "$v" != "$VERSION" ]; then echo "::error::$f is $v, not $VERSION"; exit 1; fi
        done
        git diff HEAD | shasum -a 256 > "$RUNNER_TEMP/versioned-tree"
