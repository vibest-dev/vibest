name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Linux runs the workspace build, including the darwin-arm64 cross-compile and the linux-x64 glibc package, and the
    # suite. The host binary is an ELF.
    # This job does not execute the macOS binary or an installed linux package.
    if: >-
      github.event_name == 'push' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(fromJSON(vars.TRUSTED_PR_AUTHORS || '[]'), github.event.pull_request.user.login)
      )
    # GitHub-hosted: free for this public repository, and a fresh VM each run.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: pnpm
      # Turborepo's local cache, carried between runs (a run saves under its commit, restores the newest earlier one).
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Confirm Linux x86_64
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64

      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run format:check
      - run: pnpm run test
      # pnpm e2e needs a local herdr and the real CLIs, so it runs locally (pnpm e2e, pnpm verify), not here.
