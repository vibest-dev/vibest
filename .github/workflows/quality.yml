name: Code check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable
        shell: bash

      - name: Setup Node & Pnpm
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # All three declare `dependsOn: ["^build"]`, so Turborepo builds the
      # upstream workspace packages on demand and caches the results.
      - run: pnpm turbo run build test typecheck

      # Oxlint and Oxfmt scan the whole repo from the root, so they are not
      # Turborepo tasks — no package defines a `lint` script.
      - run: pnpm run lint:check
      - run: pnpm run format:check
