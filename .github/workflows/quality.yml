name: Code check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  CI: "true"

# A newer commit makes older runs for the same PR or branch obsolete. Cancel it
# before it consumes another slot on the single self-hosted runner.
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    # Pull request events still appear in Actions for other authors, but the job
    # is skipped before GitHub assigns it to the self-hosted runner.
    if: >-
      github.event_name == 'push' ||
      contains(fromJSON(vars.TRUSTED_PR_AUTHORS || '[]'), github.event.pull_request.user.login)
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04, rn, vibest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Persistent caches live beside _work so checkout can stay clean without
      # actions/cache tarballs on every run. See .github/scripts/bootstrap-ci-runner.sh.
      - name: Prepare persistent CI caches
        run: |
          cache_root="${RUNNER_WORKSPACE}/../.vibest-ci-cache"
          mkdir -p "${cache_root}/pnpm-store" "${cache_root}/turbo"
          {
            echo "PNPM_STORE_DIR=${cache_root}/pnpm-store"
            echo "TURBO_CACHE_DIR=${cache_root}/turbo"
          } >> "$GITHUB_ENV"

      - name: Setup project toolchain
        run: |
          {
            echo "/usr/local/bin"
            echo "${HOME}/.local/share/mise/shims"
          } >> "$GITHUB_PATH"
          export PATH="/usr/local/bin:${HOME}/.local/share/mise/shims:${PATH}"
          mise install --locked
        shell: bash

      - name: Verify CI environment
        run: |
          source /etc/os-release
          test "$ID" = "ubuntu"
          test "$VERSION_ID" = "24.04"
          test "$(uname -m)" = "x86_64"

          expected_node="$(mise current node)"
          actual_node="$(node --version)"
          actual_node="${actual_node#v}"
          test "$actual_node" = "$expected_node"

          expected_pnpm="$(mise current pnpm)"
          metadata_pnpm="$(node -p "require('./package.json').packageManager.match(/^pnpm@([^+]+)/)[1]")"
          actual_pnpm="$(pnpm --version)"
          test "$metadata_pnpm" = "$expected_pnpm"
          test "$actual_pnpm" = "$expected_pnpm"

          printf 'Ubuntu %s, Node %s, pnpm %s, %s\n' \
            "$VERSION_ID" "$actual_node" "$actual_pnpm" "$(uname -m)"
        shell: bash

      - run: pnpm install --frozen-lockfile --prefer-offline --store-dir "$PNPM_STORE_DIR"

      # All three declare `dependsOn: ["^build"]`, so Turborepo builds the
      # upstream workspace packages on demand and caches the results.
      # Lint/format only need node_modules and run in parallel with turbo.
      - name: Run build, test, typecheck, lint, and format
        run: |
          set -euo pipefail

          pnpm turbo run build test typecheck &
          turbo_pid=$!

          pnpm run lint:check &
          lint_pid=$!

          pnpm run format:check &
          format_pid=$!

          wait "$turbo_pid"
          wait "$lint_pid"
          wait "$format_pid"
