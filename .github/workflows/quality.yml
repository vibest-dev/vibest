name: Code check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable
        shell: bash

      - name: Setup Node & Pnpm
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build workspace packages first so type-checking and linting resolve the
      # generated `dist` outputs (Vite Task replaces Turborepo's `^build`).
      - run: pnpm run build:packages

      - run: pnpm run test
      - run: pnpm run lint:check
      - run: pnpm run typecheck
