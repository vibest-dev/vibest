# React Doctor — finds security, performance, correctness, accessibility,
# bundle-size, and architecture issues in React codebases.
#
# Docs: https://www.react.doctor/ci
# Source: https://github.com/millionco/react-doctor

name: React Doctor

on:
  # Scans the PR's changed files and posts a sticky summary comment listing only the new issues introduced relative to the merge base of the target branch.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Scans `main` on every push to track the health-score trend and catch regressions that slipped past PR review.
  push:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

env:
  CI: "true"

# Cancels any in-flight scan for the same PR (or branch, on push) the moment a new commit arrives, so reviewers only ever see the latest run.
concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    # Pull request events still appear in Actions for other authors, but the job
    # is skipped before GitHub assigns it to the self-hosted runner.
    if: >-
      github.event_name == 'push' ||
      contains(fromJSON(vars.TRUSTED_PR_AUTHORS || '[]'), github.event.pull_request.user.login)
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04, rn, vibest]
    steps:
      # fetch-depth: 0 gives React Doctor the full git history it needs to find the merge base with the target branch. Without it a shallow checkout has no merge base, so PR runs can't compare against the base and fall back to reporting every issue in the changed files (pre-existing ones included) instead of only the ones the PR introduced.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read project Node version
        id: project-node
        run: echo "version=$(tr -d '[:space:]' < .node-version)" >> "$GITHUB_OUTPUT"
        shell: bash

      - uses: millionco/react-doctor@01820bb4fd4d0a4aebcd8df2b2a143a098649cb2 # v2.2.8
        # The repo is error-clean as of the react-doctor integration, so the gate
        # is armed: any new error-severity finding fails the check. Warnings stay
        # advisory — there are ~115 of them left to work through, and blocking on
        # them today would red-X every PR.
        # Full reference: https://www.react.doctor/ci
        with:
          node-version: ${{ steps.project-node.outputs.version }}
          blocking: error
          scope: full
          # Everything except @vibest/ui. Its base components are vendored
          # wholesale from the coss registry via `shadcn add @coss/ui --overwrite`
          # and local edits are discarded on the next refresh (docs/adr/0001), so
          # diagnostics raised there are un-actionable here — the fix belongs
          # upstream. Scan it deliberately with `cd packages/ui && react-doctor`,
          # which picks up packages/ui/doctor.config.json.
          # Note this is an allowlist: a new React workspace must be added here to
          # be covered. It lives in the workflow rather than a root
          # doctor.config.json because config is inherited by subdirectories, and
          # a root `projects` field makes the per-project `pnpm doctor` run fail.
          project: "@vibest/app,desktop"
