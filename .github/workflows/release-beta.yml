name: Release

# The only way to release (.agents/rules/release.md). The version comes from main: a release is prepared as a pull
# request that bumps every package (pnpm bump --release <prerelease|patch|minor|major|version>, which commits only the
# version change) and, when there is one, adds the CHANGELOG.md section; it merges like any change, through CI. Then
# the owner starts this workflow on main from the Actions page, or
#   gh workflow run release-beta.yml -R vibest-dev/vibest --ref main
# Started by hand, not by a push to main: the owner chooses when, and a run that failed is simply started again.
# It never pushes to main. build checks main's version has no v<version> tag and no npm release yet, runs the release
# gate on main's commit (the whole of pnpm verify but the macOS-only H4) and packs and checks the tarballs. darwin
# (macos-latest) runs pnpm verify H4 on the same commit and checks the same tarballs. publish waits for the owner's
# approval (environment `release`), then tags that commit v<version> (GITHUB_TOKEN; no ruleset covers tags), publishes
# exactly the tarballs build checked to npm, and makes the GitHub Release (install.sh and an archive per platform;
# notes from CHANGELOG.md when it has this version, else GitHub's).
# canary publishes <version>-canary.<time>.g<sha> to npm under `canary`, set in the run's checkout only: no tag, no
# GitHub Release; from any branch.
# dry_run runs every gate on any branch and stops: nothing is tagged or published.
# Only the owner starts it; anyone else's run is skipped. Every job checks it: the owner both started the run (actor)
# and started this attempt (triggering_actor, which differs on a rerun), since rerunning one job reuses the others'
# earlier results without evaluating their conditions.
on:
  workflow_dispatch:
    inputs:
      canary:
        description: "Publish a canary of main's version to npm under `canary` (no tag, no GitHub Release)"
        required: true
        default: false
        type: boolean
      dry_run:
        description: "Run every gate, then stop: no tag, no publish"
        required: true
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

# What pnpm verify's E2E checks drive, pinned. The runners are fresh, so build installs them each run (cached by these
# versions). E2E answers every harness with a fake model: no login.
env:
  HERDR_VERSION: 0.9.5
  HERDR_SHA256: 14d9e8bc8b4a9e0118d77c32266f76d461f09b40342eb23752960bd89f59929d # herdr-linux-x86_64
  HC_VERSION: 0.1.19
  HC_SHA256: 4adcfb423d52f24c5cc4a1e2cd2fcad1f62d28bb77876ac472c29082a3eaa424 # herdr-core-linux-x86_64.tar.gz
  PI_VERSION: 1.5.0 # @earendil-works/pi-coding-agent
  CLAUDE_VERSION: 2.1.322 # @anthropic-ai/claude-code
  CURSOR_VERSION: 2026.11.05-86047df

jobs:
  build:
    if: >-
      (github.actor == github.repository_owner || github.actor == 'iamdin') &&
      (github.triggering_actor == github.repository_owner || github.triggering_actor == 'iamdin')
    # GitHub-hosted (free for this public repository): a fresh VM each run.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
    steps:
      - name: Release only from main
        if: ${{ !inputs.dry_run && !inputs.canary && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::a release runs on main, not $GITHUB_REF; start it with --ref main, or set dry_run or canary"
          exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile --prefer-offline

      - uses: actions/cache@v4
        with:
          path: ~/.cache/vibest-e2e-tools
          key: e2e-tools-2-${{ runner.os }}-${{ env.HERDR_VERSION }}-${{ env.HC_VERSION }}-${{ env.PI_VERSION }}-${{ env.CLAUDE_VERSION }}-${{ env.CURSOR_VERSION }}
      # Into ~/.local/bin, which the login shell puts on PATH: E2E runs the harnesses with the login environment.
      - name: Install herdr, hc, pi, claude and cursor-agent
        run: |
          tools="$HOME/.cache/vibest-e2e-tools"
          bin="$HOME/.local/bin"
          mkdir -p "$tools" "$bin"
          if [ ! -x "$tools/herdr" ]; then
            curl -fsSL -o "$tools/herdr.download" "https://github.com/herdrdev/herdr/releases/download/v$HERDR_VERSION/herdr-linux-x86_64"
            echo "$HERDR_SHA256  $tools/herdr.download" | sha256sum -c -
            chmod +x "$tools/herdr.download" && mv "$tools/herdr.download" "$tools/herdr"
          fi
          if [ ! -x "$tools/hc/herdr-core" ]; then
            curl -fsSL -o "$tools/hc.tar.gz" "https://releases.herdr.dev/core/$HC_VERSION/herdr-core-linux-x86_64.tar.gz"
            echo "$HC_SHA256  $tools/hc.tar.gz" | sha256sum -c -
            mkdir -p "$tools/hc" && tar -xzf "$tools/hc.tar.gz" -C "$tools/hc" && rm "$tools/hc.tar.gz"
          fi
          if [ ! -x "$tools/cursor/cursor-agent" ]; then
            mkdir -p "$tools/cursor"
            curl -fsSL "https://downloads.cursor.com/lab/$CURSOR_VERSION/linux/x64/agent-cli-package.tar.gz" \
              | tar --strip-components=1 -xzf - -C "$tools/cursor"
          fi
          # Claude's platform package holds the native binary itself (the wrapper package needs its install script).
          claude="$tools/npm/node_modules/@anthropic-ai/claude-code-linux-x64/claude"
          if [ ! -x "$claude" ]; then
            npm install --prefix "$tools/npm" --no-audit --no-fund \
              "@earendil-works/pi-coding-agent@$PI_VERSION" "@anthropic-ai/claude-code-linux-x64@$CLAUDE_VERSION"
            chmod +x "$claude"
          fi
          ln -sf "$tools/herdr" "$bin/herdr"
          ln -sf "$tools/hc/herdr-core" "$bin/hc"
          ln -sf "$tools/hc/herdr-core" "$bin/herdr-core"
          ln -sf "$tools/cursor/cursor-agent" "$bin/cursor-agent"
          ln -sf "$tools/npm/node_modules/.bin/pi" "$bin/pi"
          ln -sf "$claude" "$bin/claude"
          ln -sf "$(command -v node)" "$bin/node"
          echo "$bin" >> "$GITHUB_PATH"
          # vibest lists the processes working in a worktree with lsof, which the image lacks.
          command -v lsof >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq lsof; }
          # A machine Claude Code has already run on: a first run writes its onboarding state into ~/.claude.json, which
          # E2E counts as a change to the user's files.
          [ -e "$HOME/.claude.json" ] || cat > "$HOME/.claude.json" <<'JSON'
          {"hasCompletedOnboarding": true, "lastOnboardingVersion": "2.1.322", "hasSeenAutoModeEntryWarning": true,
           "hasResetAutoModeOptInForDefaultOffer": true, "hasSeenAutoModeOutsideReadPrompt": true}
          JSON
          # bash -l reads the first of these that exists.
          profile="$HOME/.bash_profile"
          for f in "$HOME/.bash_profile" "$HOME/.bash_login" "$HOME/.profile"; do
            if [ -e "$f" ]; then profile=$f; break; fi
          done
          echo 'PATH="$HOME/.local/bin:$PATH"' >> "$profile"
          env -i HOME="$HOME" PATH=/usr/bin:/bin bash -l -i -c \
            'for b in herdr hc pi claude cursor-agent node; do printf "%s: " "$b"; "$b" --version 2>&1 | head -1 || exit 1; command -v "$b" >/dev/null || exit 1; done'

      # The version every job checks and publishes: main's, which a merged release pull request set. A canary sets its
      # own in this checkout only.
      - name: Version
        id: version
        env:
          CANARY: ${{ inputs.canary }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Every workspace package moves together: workspace:* resolves to it, and the binary embeds it (Hello compares it).
          # The same files as the root `bump` script. A package left behind fails the run before anything is built.
          same() {
            for f in packages/*/package.json packages/integration/*/package.json tools/tsconfig/package.json tools/verify/package.json; do
              v=$(node -p "require('./$f').version")
              if [ "$v" != "$1" ]; then echo "::error::$f is $v, not $1"; exit 1; fi
            done
          }
          version=$(node -p 'require("./packages/cli/package.json").version')
          same "$version"
          if [ "$CANARY" = true ]; then
            # g<sha>: a prerelease identifier of only digits may not start with 0.
            version="${version%%-*}-canary.$(date -u +%Y%m%d%H%M%S).g$(git rev-parse --short=7 HEAD)"
            dist_tag=canary
            pnpm -r exec npm pkg set version="$version"
            same "$version"
          else
            case "$version" in *-*) dist_tag=beta ;; *) dist_tag=latest ;; esac
            # Released already: merge a release pull request that bumps the version first. A dry run only warns, so it
            # can run the gates on any branch. A tag on this very commit is a release that stopped partway (publish
            # tags first): this run finishes it, and publish skips what is already done.
            level=error
            if [ "$DRY_RUN" = true ]; then level=warning; fi
            tagged=$(git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY.git" "v$version*" \
              | awk -v r="refs/tags/v$version" '{ s[$2] = $1 } END { print (r "^{}") in s ? s[r "^{}"] : s[r] }')
            if [ "$tagged" = "$GITHUB_SHA" ]; then
              echo "::notice::v$version already tags this commit: this run finishes that release"
            elif [ -n "$tagged" ]; then
              echo "::$level::tag v$version already exists on $tagged, not this commit; bump the version in a release pull request"
              [ "$level" = warning ] || exit 1
            elif [ "$(npm view "@vibest/cli@$version" version 2>/dev/null </dev/null)" = "$version" ]; then
              echo "::$level::@vibest/cli@$version is already on npm; bump the version in a release pull request"
              [ "$level" = warning ] || exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "Release $version under the npm dist-tag $dist_tag" >> "$GITHUB_STEP_SUMMARY"

      # The release gate: the whole of pnpm verify on the commit to release (build, typecheck and lint, unit tests, the
      # curl and npm installs, and every E2E check on each, --strict), --no-cache so every check runs. H4 is macOS-only:
      # verify leaves it to the darwin job's verify of the same commit, and publish needs both.
      - run: pnpm run verify --no-cache --elsewhere H4
      # On a failure: each check's evidence (redacted) and the vibestd log of every world E2E kept.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-evidence-linux
          path: |
            tools/e2e/evidence
            /tmp/vbe-*/vibest/vibestd.log
          if-no-files-found: ignore
          retention-days: 7
      # Packs every package to publish (the darwin-arm64 binary is cross-compiled here), checks the tarballs, installs
      # @vibest/cli with the linux-x64 binary from them and runs it; keeps the tarballs and their publish order.
      - name: Pack and check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bun tools/verify/src/release-artifacts.ts "$VERSION" --out "$RUNNER_TEMP/release/npm"
      # What install.sh downloads (releases/latest/download/...): an archive per platform, install.sh itself, and
      # `version`, which `vibest update` reads. Not for a canary.
      - name: GitHub Release files
        if: ${{ !inputs.canary }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          out="$RUNNER_TEMP/release/github"
          mkdir -p "$out"
          for target in darwin-arm64 linux-x64; do
            (cd packages/cli && bun scripts/build-archive.ts "$target" "$out")
          done
          cp packages/cli/install.sh "$out/install.sh"
          printf '%s\n' "$VERSION" > "$out/version"
      # The tarballs are built from this tree: it must be the commit (plus a canary's version) the gates ran on.
      - name: Tree unchanged
        if: ${{ !inputs.canary }}
        run: |
          if ! git diff --quiet HEAD; then echo "::error::the gates changed tracked files"; git diff --stat HEAD; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 7

  # On a GitHub-hosted arm64 Mac: pnpm verify H4 (the macOS-only check build's verify leaves to it) on the same
  # commit, and build's tarballs: @vibest/cli installed with the darwin-arm64 binary and run.
  darwin:
    needs: build
    if: >-
      (github.actor == github.repository_owner || github.actor == 'iamdin') &&
      (github.triggering_actor == github.repository_owner || github.triggering_actor == 'iamdin')
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/release
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm run verify --no-cache H4
      - name: Check the tarballs
        run: node tools/verify/src/release-artifacts.ts "$VERSION" --from "$RUNNER_TEMP/release/npm"

  publish:
    needs: [build, darwin]
    if: >-
      !inputs.dry_run &&
      (github.actor == github.repository_owner || github.actor == 'iamdin') &&
      (github.triggering_actor == github.repository_owner || github.triggering_actor == 'iamdin')
    # The owner approves here: the environment's required reviewer, and only main may deploy to it.
    environment: release
    # GitHub-hosted: npm provenance and trusted publishing (OIDC) refuse self-hosted runners. It downloads the artifact
    # and tags and publishes it as it is: no install, build or check.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the tag and the GitHub Release
      id-token: write # npm trusted publishing (OIDC) and provenance
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/release

      # The commit the gates ran on (GITHUB_SHA, the run's commit on main), with GITHUB_TOKEN: nothing is pushed to a
      # branch. CHANGELOG.md comes from it too. Every step below is safe to rerun after a release that stopped partway:
      # it skips what is already done exactly as this run would do it, and fails on anything else.
      - uses: actions/checkout@v4
        if: needs.build.outputs.dist_tag != 'canary'
      - name: Tag v${{ needs.build.outputs.version }}
        if: needs.build.outputs.dist_tag != 'canary'
        run: |
          tagged=$(git ls-remote --tags origin "v$VERSION*" \
            | awk -v r="refs/tags/v$VERSION" '{ s[$2] = $1 } END { print (r "^{}") in s ? s[r "^{}"] : s[r] }')
          if [ "$tagged" = "$GITHUB_SHA" ]; then echo "v$VERSION already tags $GITHUB_SHA; skipped"; exit 0; fi
          if [ -n "$tagged" ]; then echo "::error::v$VERSION tags $tagged, not $GITHUB_SHA"; exit 1; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            tag --annotate --message "v$VERSION" "v$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"

      # npm 11.5.1 or later publishes with OIDC; no token.
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0

      # The checked tarballs, not rebuilt or repacked, dependencies first (publish-order). Publishing is not atomic: a
      # failure can leave only some packages released. A rerun skips each package already on npm with this exact
      # tarball (the same integrity) and fails on one published from a different tarball.
      - name: Publish
        env:
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
        run: |
          npm --version
          npm_dir="$RUNNER_TEMP/release/npm"
          while read -r name file; do
            published=$(npm view "$name@$VERSION" dist.integrity 2>/dev/null </dev/null)
            if [ -n "$published" ]; then
              tested="sha512-$(openssl dgst -sha512 -binary "$npm_dir/$file" | base64 -w0)"
              if [ "$published" != "$tested" ]; then
                echo "::error::$name@$VERSION is on npm from a different tarball ($published, tested $tested)"; exit 1
              fi
              echo "$name@$VERSION is already on npm from this tarball; skipped"
              continue
            fi
            npm publish "$npm_dir/$file" --provenance --tag "$DIST_TAG" --access public </dev/null
          done < "$npm_dir/publish-order"

      # Marked latest, so the download URLs move to it.
      - name: GitHub Release
        if: needs.build.outputs.dist_tag != 'canary'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The GitHub Release v$VERSION exists; skipped"; exit 0
          fi
          # The notes: the CHANGELOG.md section headed with this version when there is one, otherwise GitHub's generated
          # notes. No section is required.
          awk -v v="$VERSION" '/^## /{ h = $2; sub(/^v/, "", h); on = (h == v); next } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then notes=(--notes-file "$RUNNER_TEMP/notes.md"); else notes=(--generate-notes); fi
          gh release create "v$VERSION" "$RUNNER_TEMP"/release/github/* -R "$GITHUB_REPOSITORY" \
            --title "vibest $VERSION" --latest --verify-tag "${notes[@]}"
