name: Release

# One entry point and one version for every package: the workspace members.
# A v* tag publishes that version under `beta`, and as the latest GitHub Release (install.sh and an archive per platform).
# Manual runs (workflow_dispatch) publish one canary version of every package to npm only.
# The self-hosted build job builds, tests and packs once; the darwin job checks those tarballs on an arm64 Mac; the
# publish job publishes exactly those tarballs (tools/verify/src/release-artifacts.ts checks them on both platforms).
# Only the owner starts it: the tag comes from `pnpm release` (.agents/rules/release.md); anyone else's run is skipped.
# Every job checks it: the owner both started the run (actor) and started this attempt (triggering_actor, which differs
# on a rerun), since rerunning one job reuses the others' earlier results without evaluating their conditions.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: >-
      (github.actor == github.repository_owner || github.actor == 'iamdin') &&
      (github.triggering_actor == github.repository_owner || github.triggering_actor == 'iamdin')
    runs-on: [self-hosted, Linux, X64, vibest, rn]
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Persistent caches beside _work, as in ci.yml.
      - name: Prepare persistent CI caches
        run: |
          cache_root="${RUNNER_WORKSPACE}/../.vibest-ci-cache"
          mkdir -p "${cache_root}/pnpm-store" "${cache_root}/turbo"
          {
            echo "PNPM_STORE_DIR=${cache_root}/pnpm-store"
            echo "TURBO_CACHE_DIR=${cache_root}/turbo"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile --prefer-offline --store-dir "$PNPM_STORE_DIR"

      # The version every job checks and publishes, computed once. Versions are set only in this checkout, never committed.
      - name: Version
        id: version
        run: |
          version=$(node -p 'require("./apps/vibest-herdr/package.json").version')
          # The same files as the root `release` script. A package left behind fails the run before anything is published.
          for f in apps/*/package.json packages/*/package.json packages/integration/*/package.json tools/tsconfig/package.json tools/verify/package.json; do
            v=$(node -p "const j = require('./$f'); [j.version, j.version].join(' ')")
            if [ "$v" != "$version $version" ]; then echo "::error::$f is $v, not $version"; exit 1; fi
          done
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match @vibest/cli $version"; exit 1
            fi
            tag=beta
          else
            # g<sha>: a prerelease identifier of only digits may not start with 0.
            version="${version%%-*}-canary.$(date -u +%Y%m%d%H%M%S).g$(git rev-parse --short=7 HEAD)"
            tag=canary
            # Every workspace package moves together: workspace:* resolves to it, and the binary embeds it (Hello compares it).
            pnpm -r exec npm pkg set version="$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run test --maxWorkers=2
      # Packs every package to publish (the darwin-arm64 binary is cross-compiled here), checks the tarballs, installs
      # @vibest/cli with the linux-x64 binary from them and runs it; keeps the tarballs and their publish order.
      - name: Pack and check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bun tools/verify/src/release-artifacts.ts "$VERSION" --out "$RUNNER_TEMP/release/npm"
      # What install.sh downloads (releases/latest/download/...): an archive per platform, install.sh itself, and
      # `version`, which `vibest update` reads. Only for a v* tag.
      - name: GitHub Release files
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          out="$RUNNER_TEMP/release/github"
          mkdir -p "$out"
          for target in darwin-arm64 linux-x64; do
            (cd apps/vibest-herdr && bun scripts/build-archive.ts "$target" "$out")
          done
          cp apps/vibest-herdr/install.sh "$out/install.sh"
          printf '%s\n' "$VERSION" > "$out/version"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 7

  # The same tarballs on a GitHub-hosted arm64 Mac: @vibest/cli installed with the darwin-arm64 binary and run.
  darwin:
    needs: build
    if: >-
      (github.actor == github.repository_owner || github.actor == 'iamdin') &&
      (github.triggering_actor == github.repository_owner || github.triggering_actor == 'iamdin')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Check the tarballs
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: bun tools/verify/src/release-artifacts.ts "$VERSION" --from "$RUNNER_TEMP/release/npm"

  publish:
    needs: [build, darwin]
    if: >-
      (github.actor == github.repository_owner || github.actor == 'iamdin') &&
      (github.triggering_actor == github.repository_owner || github.triggering_actor == 'iamdin')
    # GitHub-hosted: npm provenance and trusted publishing (OIDC) refuse self-hosted runners.
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub Release of a v* tag
      id-token: write # npm trusted publishing (OIDC) and provenance
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      # npm 11.5.1 or later publishes with OIDC; no token.
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/release

      # The checked tarballs, not rebuilt or repacked, dependencies first (publish-order); versions already on npm are
      # skipped. The registry can lag behind a successful publish. Publishing is not atomic: a failure can leave only
      # some packages released, and a rerun neither rolls back a partial release nor repairs its tags; reconcile it
      # deliberately.
      - name: Publish
        env:
          DIST_TAG: ${{ needs.build.outputs.tag }}
        run: |
          npm --version
          npm_dir="$RUNNER_TEMP/release/npm"
          while read -r name file; do
            if [ "$(npm view "$name@$VERSION" version 2>/dev/null </dev/null)" = "$VERSION" ]; then
              echo "$name@$VERSION is already on npm; skipped"
              continue
            fi
            npm publish "$npm_dir/$file" --provenance --tag "$DIST_TAG" --access public </dev/null
          done < "$npm_dir/publish-order"

      # Marked latest, so the download URLs move to it.
      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/release/github/* -R "$GITHUB_REPOSITORY" \
            --title "vibest $VERSION" --latest --verify-tag
