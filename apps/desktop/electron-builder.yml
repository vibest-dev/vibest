appId: com.vibest.desktop
productName: Vibest
directories:
  buildResources: build
  output: release
files:
  - dist/**/*
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
  # The Claude Agent SDK's platform packages each hold a ~230 MB native `claude`
  # binary. We do not ship it: the server execs the user's own Claude Code
  # install instead, so they can update it independently of vibest.
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk-*/**"
asarUnpack:
  - resources/**
  - "**/*.node"
  - "**/node-pty/**"
icon: resources/icon.png
mac:
  icon: resources/icon.icns
  target:
    - dmg
    - zip
  artifactName: ${productName}-${version}-${arch}.${ext}
  identity: null
  entitlementsInherit: build/entitlements.mac.plist
  electronLanguages:
    - en
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
afterPack: scripts/ad-hoc-sign.cjs
