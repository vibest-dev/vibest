packages:
  - apps/*
  - packages/*
  - packages/integration/*
  - tools/tsconfig
  - tools/verify
  - tools/bench
catalog:
  # Effect v4 moves in lockstep: every `effect` / `@effect/*` package on one version, or two runtimes meet. Exact pins.
  effect: 4.0.2
  "@effect/platform-bun": 4.0.2
  "@effect/platform-node-shared": 4.0.2
  "@effect/sql-sqlite-bun": 4.0.2
  "@effect/vitest": 4.0.2
  "@earendil-works/pi-coding-agent": 1.1.0
overrides:
  # The catalog governs our package.json entries; this forces transitive copies (peers of @effect/*) onto it too.
  effect: "catalog:"
  "@effect/platform-node-shared": "catalog:"
# pnpm 11+ waits 24h before installing a new release by default; our own just-published packages would be blocked.
minimumReleaseAge: 0
allowBuilds:
  # Transitive dependencies of @earendil-works/pi-coding-agent, which @vibest/pi only uses for types: their scripts are not needed.
  "@google/genai": false
  protobufjs: false
