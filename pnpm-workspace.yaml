packages:
  - apps/*
  - packages/*
  - tools/*
onlyBuiltDependencies:
  - electron
  - esbuild
  - "@swc/core"
catalog:
  "@effect/platform-node": 4.0.0-beta.97
  "@effect/vitest": 4.0.0-beta.97
  effect: 4.0.0-beta.97
  vite: ^8.1.4
  vitest: 4.1.10
overrides:
  vite: "catalog:"
  vitest: "catalog:"
  # ^2.0.0-beta.16 ranges admit the 2.0.0 stable release; @orpc/client floated
  # to stable while @orpc/contract stayed on beta.16, breaking the runtime
  # (stable client imports ORPC_HEADER, absent from the beta contract).
  # Pin the whole family to the beta until the repo migrates to stable.
  "@orpc/client": "2.0.0-beta.16"
  "@effect/platform-node": "catalog:"
  "@effect/vitest": "catalog:"
  effect: "catalog:"
# pnpm 11 defaults minimumReleaseAge to 24h; disable it — the same-day
# dependency bumps this repo does (e.g. claude-agent-sdk) would be blocked,
# and its publish-time verification deadlocks pnpm 11.11.0 behind proxies.
minimumReleaseAge: 0
allowBuilds:
  # Its postinstall only probes node-pty's spawn-helper and logs — it builds
  # nothing, so there is nothing to gain by running it.
  "@code-inspector/core": false
  "@swc/core": true
  electron: true
  electron-winstaller: true
  esbuild: true
  msgpackr-extract: true
  node-pty: true
  # sharp is a transitive dep of react-scan (desktop devDependency) via next;
  # it ships prebuilt binaries, so its build script is unnecessary — deny it.
  sharp: false
  # The root `prepare` script installs the hooks (and sets core.hooksPath so it
  # works inside git worktrees); the package's own postinstall would just fail.
  simple-git-hooks: false
